<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employees</title><link rel="stylesheet" href="../css/style.css"></head><body><header id="nav"></header><main><h1>Employees</h1>
<div class="card"><h2 id="ft">Add employee</h2><form id="f"><input type="hidden" id="editId">
<div class="two"><div><label>Full name</label><input id="name"><small class="err" id="e_name"></small>
<label>Email (login)</label><input id="email"><small class="err" id="e_email"></small>
<label>Password <small id="pn">(min 4)</small></label><input id="password" type="password"><small class="err" id="e_password"></small></div>
<div><label>Department</label><input id="department" list="dl"><datalist id="dl"></datalist><small class="err" id="e_department"></small>
<label>Monthly salary</label><input id="salary" type="number" min="0"><small class="err" id="e_salary"></small>
<label>Joining date</label><input id="joined" type="date"><small class="err" id="e_joined"></small></div></div>
<button class="btn" id="sv">Add employee</button> <button type="button" class="btn gray" id="cx" hidden>Cancel</button></form></div>
<div class="card"><div class="row"><input id="search" placeholder="Search name or email"><select id="dep"></select></div>
<div class="tw"><table><thead><tr><th>Name</th><th>Email</th><th>Department</th><th>Salary</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div>
</main><script src="../js/storage.js"></script><script src="../js/auth.js"></script><script src="../js/ui.js"></script><script src="../js/leave.js"></script><script src="../js/attendance.js"></script><script src="../js/helper.js"></script><script src="../js/employees.js"></script></body></html>
